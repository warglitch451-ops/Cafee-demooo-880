<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | The Royal Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">THE ROYAL TABLE</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <div class="contact-hero">
        <h1>Reserve Your Table</h1>
    </div>
    <div class="contact-container">
        <div class="info">
            <h2>📍 Visit Us</h2>
            <p>123, Luxury Avenue, Vesu, Surat - 395007</p>
            <h2>📞 Call</h2>
            <p>+91 98765 43210</p>
            <h2>✉️ Email</h2>
            <p>reservations@royaltable.com</p>
            <div class="map"><iframe src="https://maps.google.com/maps?q=surat&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%" height="200" style="border:0; border-radius:16px;" allowfullscreen loading="lazy"></iframe></div>
        </div>
        <div class="form">
            <h2>Send a Message</h2>
            <form action="#" method="post">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="tel" placeholder="Phone Number">
                <textarea rows="4" placeholder="Message / Reservation request"></textarea>
                <button type="submit">Send Inquiry</button>
            </form>
        </div>
    </div>
    <footer><p>&copy; 2025 The Royal Table – Luxury Dining. All rights reserved.</p></footer>
</body>
</html>
